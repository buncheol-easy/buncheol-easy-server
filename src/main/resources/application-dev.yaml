spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  sql:
    init:
      mode: never

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

logging:
  level:
    root: INFO
    buncheoleasy: INFO

app:
  base-url: ${APP_BASE_URL}

delivery:
  tracker:
    callback-url: ${DELIVERY_TRACKER_CALLBACK_URL}
