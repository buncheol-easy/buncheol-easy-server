name: Deploy Backend Production

# main push -> GitHub 호스팅 러너가 이미지를 빌드해 ECR 에 push 하고,
# production EC2 의 self-hosted runner 는 pull + 블루-그린 무중단 전환만 한다.
# 구조·근거는 deploy-staging.yml 과 동일(빌드를 박스 밖으로 — docs 35 §8-A,
# 무중단 전환 — docs/36 방안 1 · docs/39, scripts/blue-green.sh).
# 차이: 트리거 main, 러너 라벨 production, 별칭 태그 prod, 진행 중 배포는 끊지 않음.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: backend-production-deploy
  # production 은 진행 중 배포를 끊지 않는다(반쯤 배포된 상태 방지).
  cancel-in-progress: false

# 기본 최소권한 — build/promote 잡만 OIDC 용 id-token 을 자체 선언으로 추가한다
permissions:
  contents: read

env:
  ECR_REGISTRY: 823164610944.dkr.ecr.ap-northeast-2.amazonaws.com
  IMAGE_REPO: bce-backend

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      id-token: write   # OIDC 토큰 발급 (aws-actions/configure-aws-credentials)
      contents: read
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Guard — main 브랜치에서만 실행
        # push 트리거는 브랜치가 고정이지만 workflow_dispatch 는 아니다 — dev 코드가 UI 클릭으로
        # production 에 배포되고 prod 별칭까지 따라가는 경로를 빌드 전에 차단 (3차 리뷰 반영).
        # free 플랜에선 Environments 게이트를 못 쓰므로 이 가드가 prod 경로의 유일한 강제 수단.
        run: |
          [ "$GITHUB_REF_NAME" = "main" ] || { echo "::error::production 배포는 main 에서만 — 현재 ref: $GITHUB_REF_NAME"; exit 1; }

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Resolve immutable image tag
        # GITHUB_SHA 고정 12자리 — git rev-parse --short=12 는 "최소" 길이라 prefix 충돌 시
        # 13자리+ 를 반환해 rollback 의 정확 일치 검증(12자리)을 통과하지 못한다 (4차 리뷰 반영)
        id: meta
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::823164610944:role/bce-gha-ecr-push
          aws-region: ap-northeast-2

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # sha- 불변 태그만 push — prod 별칭은 헬스체크 통과 후 promote 잡이 옮긴다 (리뷰 #89).
          # ⚠️ main 머지 커밋은 dev 와 SHA 가 달라 prod 는 재빌드된다 — staging 에서 검증한
          # 이미지와 바이트 동일하지 않다(같은 소스의 재현 빌드). 승격 모델 전환은 후속 검토.
          tags: ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_REPO }}:${{ steps.meta.outputs.tag }}
          # 빌드 출처 ref 라벨 — rollback 의 계보 검증이 읽는다 (4차 리뷰 반영)
          labels: |
            bce.ref=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          # 기본 브랜치(dev)의 캐시는 모든 브랜치에서 읽힌다 — main 빌드도 dev 가 시딩한
          # 캐시를 재사용할 수 있다(리뷰 재검토에서 주석 정정).
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: [self-hosted, production]
    # 내부 최악 예산: checkout/rsync ~1m + 락 대기 2m + pull 5.5m(-k 유예 포함) + up 3.5m
    # + 헬스 3m + 웜업 15s + 드레인 30s + 최종확인 5s + graceful 정지 45s ≈ 16.6m — 이보다
    # 커야 OS 레벨 timeout 이 잡 취소보다 먼저 발화한다. 초과 취소 지점이 하필 "전환 후·
    # 구 색 정지 전"이면 두 색이 동시에 뜬 채 남는다 (3차 리뷰 산식 재계산)
    timeout-minutes: 20
    env:
      IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Sync source to deploy dir (preserve .env)
        run: |
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.gradle' \
            --exclude='build' \
            --exclude='.env*' \
            "${GITHUB_WORKSPACE}/" /home/ubuntu/buncheol-easy-server/

      - name: Blue-green deploy (무중단 전환)
        # 제자리 교체(up -d 재생성)의 부팅 창 502 를 없앤다 — 비활성 색으로 기동 →
        # 헬스 → Nginx upstream 전환(reload, 0초) → 드레인 → 구 색 graceful 정지.
        # 헬스 게이트·이미지 대조·롤백 좌표 기록은 전부 스크립트 안에 있다 (docs/36 방안 1 · docs/39).
        run: |
          set -e
          cd /home/ubuntu/buncheol-easy-server
          export BACKEND_IMAGE="${ECR_REGISTRY}/${IMAGE_REPO}:${IMAGE_TAG}"
          bash scripts/blue-green.sh deploy

      - name: Post-mortem snapshot
        # cancelled() 포함 — 잡 타임아웃(=취소)이 가장 진단이 필요한 케이스다 (리뷰 #89 반영)
        if: failure() || cancelled()
        run: |
          cd /home/ubuntu/buncheol-easy-server || true
          free -h || true
          cat /etc/nginx/conf.d/bce-backend-upstream.conf || true
          docker ps -a --filter name=buncheoleasy-backend --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' || true
          docker logs buncheoleasy-backend-blue --tail=50 || true
          docker logs buncheoleasy-backend-green --tail=50 || true
          # 레거시(블루-그린 도입 전 단일 컨테이너) — 첫 배포 진단용, 이후 무해한 no-op
          docker logs buncheoleasy-backend --tail=50 || true

      - name: Retain last 3 images (rollback cache)
        # 박스 빌드가 없어져 builder prune 은 불필요해졌다. pull 된 sha- 이미지는 태그가 있어
        # image prune 으로 안 지워지므로 최근 3개만 남기고 정리한다(GitHub 불능 시 오프라인 롤백용).
        # 레지스트리 쪽 보존은 ECR lifecycle policy(sha- 최근 10개)가 담당한다.
        # ⚠️ 정렬은 이미지 Created(빌드 시각) 기준이지 pull 시각이 아니다 — 롤백으로 되돌린 옛
        # 이미지는 이후 배포 몇 번이면 밀려날 수 있다(실행 중·정지 컨테이너가 참조하는 이미지는
        # rmi 실패로 살아남음 — 정지된 구 색 컨테이너가 물고 있는 롤백 이미지도 그래서 안전).
        # 취소 시에는 돌지 않는다 — 롤백이 이 배포를 선점(취소)한 순간 오프라인 롤백 캐시를
        # 지우면 안 되기 때문 (리뷰 반영).
        if: success() || failure()
        run: |
          docker images --format '{{.Repository}}:{{.Tag}}' "${ECR_REGISTRY}/${IMAGE_REPO}" \
            | grep ':sha-' | tail -n +4 | xargs -r docker rmi || true
          docker image prune -f || true

  promote:
    # 별칭은 배포가 헬스체크까지 통과한 뒤에만 이동한다 — 실패한 배포의 이미지를 별칭이
    # 가리키면, 박스 .env 기본값(:prod)을 쓰는 수동 up/restart 가 롤백을 조용히 원복시킨다
    # (리뷰 #89 반영). 재빌드 없이 ECR 매니페스트 재태깅만 한다.
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    env:
      IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::823164610944:role/bce-gha-ecr-push
          aws-region: ap-northeast-2

      - name: Move 'prod' alias to deployed image
        run: |
          set -e
          # accepted-media-types 명시 — buildx 는 OCI 매니페스트로 push 하므로 요청·회신 포맷을
          # 고정해 put-image 왕복을 결정론적으로 만든다 (3차 리뷰 반영)
          resp=$(aws ecr batch-get-image --repository-name "$IMAGE_REPO" \
            --image-ids imageTag="$IMAGE_TAG" \
            --accepted-media-types "application/vnd.oci.image.manifest.v1+json" "application/vnd.docker.distribution.manifest.v2+json" \
            --output json)
          manifest=$(echo "$resp" | jq -r '.images[0].imageManifest // empty')
          mt=$(echo "$resp" | jq -r '.images[0].imageManifestMediaType // empty')
          # 태그 미존재 시 batch-get-image 는 exit 0 + failures 에만 담긴다 — 명시적 가드 (리뷰 반영)
          [ -n "$manifest" ] || { echo "::error::ECR 에 태그 없음: $IMAGE_TAG"; exit 1; }
          # mediaType 미전달 시 OCI 매니페스트에서 UnsupportedImageTypeException 가능 (리뷰 반영)
          args=(--repository-name "$IMAGE_REPO" --image-tag prod --image-manifest "$manifest")
          [ -n "$mt" ] && args+=(--image-manifest-media-type "$mt")
          out=$(aws ecr put-image "${args[@]}" 2>&1) \
            || { echo "$out" | grep -q ImageAlreadyExistsException || { echo "$out"; exit 1; }; }
          echo "alias 'prod' -> ${IMAGE_TAG}"

      - name: Warn on stale alias
        # deploy 성공 + promote 실패 = 박스는 신버전인데 별칭은 구버전 — 이 상태에서 박스
        # .env 기본값으로 수동 up/restart 하면 조용히 구버전으로 되돌아간다 (4차 리뷰 반영)
        if: failure()
        run: echo "::error::별칭 이동 실패 — 박스는 ${IMAGE_TAG} 로 떠 있으나 'prod' 별칭은 이전 이미지를 가리킨다. 이 잡을 재실행해 별칭을 맞추기 전까지 박스에서 compose up/restart 금지 (docs/38 §5)."
