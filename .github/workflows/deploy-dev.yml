name: Deploy Backend Dev

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: backend-dev-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync source to EC2
        run: |
          rsync -avz --delete \
            --exclude ".git" \
            --exclude ".gradle" \
            --exclude "build" \
            --exclude ".idea" \
            --exclude ".env" \
            --exclude "*.log" \
            -e "ssh -i ~/.ssh/ec2_key" \
            ./ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ secrets.DEPLOY_PATH }}/

      - name: Build and run backend container
        run: |
          ssh -i ~/.ssh/ec2_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e

            cd "${{ secrets.DEPLOY_PATH }}"

            docker compose --profile backend up -d --build

            echo "Waiting for backend health check..."

            MAX_RETRY=30
            count=0

            until curl -fsS http://127.0.0.1:8080/actuator/health > /dev/null; do
              count=$((count + 1))

              if [ "$count" -ge "$MAX_RETRY" ]; then
                echo "Backend health check failed after ${MAX_RETRY} retries"
                docker logs buncheoleasy-backend --tail=100
                exit 1
              fi

              echo "Backend is not ready yet... retry $count"
              sleep 5
            done

            echo "Backend health check passed"

            docker image prune -f
          EOF