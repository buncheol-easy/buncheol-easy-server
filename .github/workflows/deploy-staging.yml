name: Deploy Backend Staging

# dev 브랜치 push -> staging EC2 의 self-hosted runner 에서 직접 배포.
# runner 가 박스 안에서 docker 를 돌리므로 SSH 키가 필요 없다.
on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: backend-staging-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, staging]
    # 정상 배포는 6분 20초대. 메모리 부족으로 빌드가 멈추면 실패하지 않고 기본 360분까지 매달리므로
    # (2026-07-29 사고: 27분·15분간 멈춤, 사람이 알아채고 취소) 빠르게 실패하도록 상한을 둔다.
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Sync source to deploy dir (preserve .env)
        run: |
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.gradle' \
            --exclude='build' \
            --exclude='.env*' \
            "${GITHUB_WORKSPACE}/" /home/ubuntu/buncheol-easy-server/

      - name: Build and run backend container (RDS compose)
        run: |
          set -e
          cd /home/ubuntu/buncheol-easy-server
          # 박스가 스왑 스래싱으로 굳으면 러너가 timeout-minutes 를 집행하지 못한다
          # (2026-07-29 사고: 수동 취소 반영에 6분). OS 레벨 timeout 은 러너가 굳어도 커널 타이머로
          # 발사돼 잡을 해방한다. 단 죽이는 대상은 compose 클라이언트 — 데몬 쪽 빌드 취소는
          # BuildKit 전파에 의존하므로 박스 회복까지 보장하진 않는다.
          # 10분 근거: 정상 6분 20초대, 스왑 열화 상태의 성공 배포도 8분 이내(35 §11-3) —
          # 빌드+헬스체크가 잡 상한 15분 안에 들어오는 예산.
          rc=0
          timeout -k 30s 10m docker compose -f docker-compose.staging.yml up -d --build || rc=$?
          if [ "$rc" -ne 0 ]; then
            if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
              echo "::error::빌드가 OS 타임아웃으로 종료됨 (rc=$rc, 124=TERM/137=KILL) — 박스 스래싱 의심, free -h 확인 (docs 35 §11-6)"
            fi
            exit "$rc"
          fi

          echo "Waiting for backend health check..."
          MAX_RETRY=40
          count=0
          # curl 자체가 매달리면 timeout 래핑 밖에서 잡이 굳는다 — 호출당 상한 필수
          until curl -fsS --connect-timeout 3 --max-time 5 http://127.0.0.1:8080/actuator/health > /dev/null; do
            count=$((count + 1))
            if [ "$count" -ge "$MAX_RETRY" ]; then
              echo "Backend health check failed after ${MAX_RETRY} retries"
              docker logs buncheoleasy-backend --tail=100
              exit 1
            fi
            echo "Backend is not ready yet... retry $count"
            sleep 5
          done
          echo "Backend health check passed"

      - name: Post-mortem snapshot
        if: failure()
        run: |
          cd /home/ubuntu/buncheol-easy-server
          free -h || true
          docker compose -f docker-compose.staging.yml ps || true
          docker logs buncheoleasy-backend --tail=100 || true

      - name: Reclaim build cache
        # 타임아웃으로 죽은 빌드의 잔여 레이어가 실패마다 쌓이지 않게 성공/실패 무관 정리
        if: always()
        run: |
          docker image prune -f || true
          docker builder prune -f --filter until=24h || true
