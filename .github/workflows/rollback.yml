name: Rollback Backend

# ECR 의 불변 sha- 태그로 빌드 없이 즉시 되돌린다(1~2분). 태그 조회·절차는 루트 docs/38.
# GitHub 자체가 불능일 때의 수동 롤백(박스에서 scripts/blue-green.sh)도 docs/38·39 에 있다.
#
# 💡 직전 버전으로의 1분 롤백은 이 워크플로보다 박스의 스위치 복귀가 빠르다:
#    ssh 박스 → nohup scripts/blue-green.sh switch <색>  (정지된 구 색 재기동 + Nginx 전환).
#    ⚠️ nohup(또는 tmux) 권장 — ssh 가 끊기면 HUP 트랩이 정리는 해 주지만 전환 자체가 중단된다.
#    이 워크플로는 임의 sha- 태그로 되돌릴 때 쓴다 — 비활성 색에 올려 전환하므로 롤백도 무중단이다.
#
# ⚠️ 실행 브랜치는 staging=dev, production=main — 첫 스텝의 가드가 이 짝을 강제한다
#    (다른 브랜치에서 실행하면 박스를 건드리기 전에 즉시 실패한다).
# ⚠️ 이미지(코드)만 되돌린다 — 박스의 compose 파일·.env·scripts 는 되돌리지 않는다. compose
#    스키마가 바뀐 배포를 롤백할 때는 수동 확인 필요.
# ⚠️ 롤백은 "브랜치를 되돌리기 전까지의 임시 조치"다 — 롤백 후 그 브랜치에 push 가 들어오면
#    새 배포가 롤백을 덮는다. revert 머지(또는 원인 수정)까지가 진짜 복구다 (3차 리뷰 반영).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: '대상 환경'
        type: choice
        options:
          - staging
          - production
        required: true
      image_tag:
        description: '되돌릴 불변 태그 (예: sha-a1b2c3d4e5f6) — ECR bce-backend 태그 목록 또는 직전 배포 로그에서 확인'
        required: true

# 배포와 같은 그룹 + cancel-in-progress: true = 롤백이 진행 중 배포를 "선점"한다.
# (false 면 장애 대응 도구가 문제를 일으킨 배포 뒤에 줄을 선다 — 리뷰 #89 반영.
#  롤백은 멱등한 pull+up 이라 끊긴 배포 위에 덮어써도 안전하다.)
concurrency:
  group: backend-${{ inputs.environment }}-deploy
  cancel-in-progress: true

# 기본 무권한 — promote 잡만 OIDC 용 id-token 을 자체 선언한다
permissions: {}

env:
  ECR_REGISTRY: 823164610944.dkr.ecr.ap-northeast-2.amazonaws.com
  IMAGE_REPO: bce-backend

jobs:
  rollback:
    runs-on:
      - self-hosted
      - ${{ inputs.environment }}
    # 내부 최악 예산: 사전 pull 5.5m + 락 대기 2m + 스크립트(관용 pull 1.25m + up 3.5m +
    # 헬스 3m + 웜업 15s + 드레인 30s + 최종확인 5s + graceful 정지 45s) ≈ 17.3m < 20m.
    # 레지스트리 무응답이 사전 pull 과 스크립트 pull 양쪽에서 5m 씩 이중 소진되지 않도록
    # 스크립트 쪽 관용 경로는 1m 상한. 초과 취소 지점이 "전환 후·구 색 정지 전"이면 두 색이
    # 동시에 뜬 채 남으므로 예산은 넉넉해야 한다 (3차 리뷰 산식 재계산).
    timeout-minutes: 20
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
      TARGET_ENV: ${{ inputs.environment }}
    steps:
      - name: Guard — 환경·브랜치·태그 검증 (박스를 건드리기 전에 fail-fast)
        # OIDC 실패는 promote(별칭 재지정)에서 — 즉 박스를 이미 되돌린 뒤에 — 터진다.
        # 그 반쪽 롤백(컨테이너는 구버전, 별칭은 깨진 이미지)을 만들지 않도록
        # 허용 짝(staging=dev / production=main)을 첫 스텝에서 강제한다 (리뷰 재검토 반영).
        run: |
          case "${TARGET_ENV}:${GITHUB_REF_NAME}" in
            staging:dev|production:main) ;;
            *) echo "::error::환경·브랜치 불일치 — staging 은 dev, production 은 main 브랜치에서 실행해야 한다 (현재: env=$TARGET_ENV, ref=$GITHUB_REF_NAME). OIDC 신뢰정책·별칭 재지정이 이 짝을 전제한다."; exit 1 ;;
          esac
          # 불변 태그 정확 일치 — 이동 별칭(=최신 재배포)과 경로 오염 문자를 모두 차단 (리뷰 반영)
          if ! echo "$IMAGE_TAG" | grep -qE '^sha-[0-9a-f]{12}$'; then
            echo "::error::불변 태그(sha-<12자리 hex>)만 허용: $IMAGE_TAG"; exit 1
          fi

      - name: Pull target image and blue-green switch
        # checkout 없음 — compose 파일·스크립트는 배포 디렉터리에 이미 있고,
        # 롤백은 코드가 아니라 이미지 좌표만 바꾸는 작업이다.
        # 계보 검증까지 통과하면 배포와 같은 블루-그린 경로를 탄다 — 비활성 색에 올려
        # 전환하므로 롤백 중에도 사용자 관점 중단이 없다 (docs/39).
        run: |
          set -e
          cd /home/ubuntu/buncheol-easy-server
          export BACKEND_IMAGE="${ECR_REGISTRY}/${IMAGE_REPO}:${IMAGE_TAG}"
          echo "Rolling back to ${BACKEND_IMAGE}"

          # ECR/네트워크 장애 시에도 롤백이 돌아야 한다 — 로컬에 이미지가 있으면 pull 실패를
          # 허용한다(불변 태그라 로컬 == 원격이 정의상 보장, 4차 리뷰 반영). 배포 스텝의
          # keep-last-3 이 이 경로의 재고를 만든다. 여기서 미리 pull 해 두면 스크립트 내부의
          # compose pull 은 즉시 no-op 이 된다.
          if docker image inspect "$BACKEND_IMAGE" >/dev/null 2>&1; then
            timeout -k 30s 5m docker pull "$BACKEND_IMAGE" \
              || echo "::warning::pull 실패 — 로컬 캐시 이미지로 진행 (불변 태그라 동일 이미지)"
          else
            timeout -k 30s 5m docker pull "$BACKEND_IMAGE"
          fi

          # 계보 검증 — 두 환경이 리포를 공유하므로 sha- 태그 풀에 dev·main 빌드가 섞여 있다.
          # production 롤백에 dev 빌드를 고르는 오조작을 이미지 라벨(bce.ref)로 차단 (4차 리뷰 반영)
          expected_ref=$([ "$TARGET_ENV" = "production" ] && echo main || echo dev)
          img_ref=$(docker image inspect -f '{{index .Config.Labels "bce.ref"}}' "$BACKEND_IMAGE" 2>/dev/null || echo "")
          if [ -n "$img_ref" ] && [ "$img_ref" != "$expected_ref" ]; then
            echo "::error::태그 계보 불일치 — 이 이미지는 '$img_ref' 빌드다. $TARGET_ENV 롤백은 '$expected_ref' 빌드만 허용"; exit 1
          fi
          [ -n "$img_ref" ] || echo "::warning::bce.ref 라벨 없음(라벨 도입 전 빌드) — 계보 자동 확인 불가, ECR push 시각으로 수동 확인 권장"

          # 헬스 게이트·이미지 대조·Nginx 전환·구 색 graceful 정지는 스크립트가 수행한다.
          bash scripts/blue-green.sh deploy
          echo "Rollback complete"

      - name: Post-mortem snapshot
        # 롤백은 이미 장애 상황 — 실패·취소 시 진단 스냅샷이 더 절실하다 (리뷰 #89 반영)
        if: failure() || cancelled()
        run: |
          cd /home/ubuntu/buncheol-easy-server || true
          free -h || true
          cat /etc/nginx/conf.d/bce-backend-upstream.conf || true
          docker ps -a --filter name=buncheoleasy-backend --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' || true
          docker logs buncheoleasy-backend-blue --tail=50 || true
          docker logs buncheoleasy-backend-green --tail=50 || true
          # 레거시(블루-그린 도입 전 단일 컨테이너) — 첫 배포 진단용, 이후 무해한 no-op
          docker logs buncheoleasy-backend --tail=50 || true

  promote:
    # 롤백 성공 시 별칭도 롤백 대상으로 재지정 — "별칭 = 지금 떠 있는 것" 불변식 유지.
    # 이게 없으면 별칭이 깨진 이미지를 계속 가리켜, 박스 .env 기본값을 쓰는 수동
    # up/restart 가 롤백을 조용히 원복시킨다 (리뷰 #89 반영).
    needs: rollback
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
      TARGET_ENV: ${{ inputs.environment }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::823164610944:role/bce-gha-ecr-push
          aws-region: ap-northeast-2

      - name: Move alias to rollback target
        run: |
          set -e
          alias=$([ "$TARGET_ENV" = "production" ] && echo prod || echo staging)
          # accepted-media-types 명시 — buildx 는 OCI 매니페스트로 push 하므로 요청·회신 포맷을
          # 고정해 put-image 왕복을 결정론적으로 만든다 (3차 리뷰 반영)
          resp=$(aws ecr batch-get-image --repository-name "$IMAGE_REPO" \
            --image-ids imageTag="$IMAGE_TAG" \
            --accepted-media-types "application/vnd.oci.image.manifest.v1+json" "application/vnd.docker.distribution.manifest.v2+json" \
            --output json)
          manifest=$(echo "$resp" | jq -r '.images[0].imageManifest // empty')
          mt=$(echo "$resp" | jq -r '.images[0].imageManifestMediaType // empty')
          # 태그 미존재 시 batch-get-image 는 exit 0 + failures 에만 담긴다 — 명시적 가드 (리뷰 반영)
          [ -n "$manifest" ] || { echo "::error::ECR 에 태그 없음: $IMAGE_TAG"; exit 1; }
          # mediaType 미전달 시 OCI 매니페스트에서 UnsupportedImageTypeException 가능 (리뷰 반영)
          args=(--repository-name "$IMAGE_REPO" --image-tag "$alias" --image-manifest "$manifest")
          [ -n "$mt" ] && args+=(--image-manifest-media-type "$mt")
          out=$(aws ecr put-image "${args[@]}" 2>&1) \
            || { echo "$out" | grep -q ImageAlreadyExistsException || { echo "$out"; exit 1; }; }
          echo "alias '$alias' -> ${IMAGE_TAG}"

      - name: Warn on stale alias
        # rollback 성공 + promote 실패 = 박스는 롤백됐는데 별칭은 깨진 이미지 — 이 상태에서
        # 박스 .env 기본값으로 수동 up/restart 하면 롤백이 조용히 원복된다 (4차 리뷰 반영)
        if: failure()
        run: echo "::error::별칭 재지정 실패 — 박스는 ${IMAGE_TAG} 로 롤백됐으나 별칭은 이전 이미지를 가리킨다. 이 잡을 재실행해 별칭을 맞추기 전까지 박스에서 compose up/restart 금지 (docs/38 §5)."
