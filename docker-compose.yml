services:
  mysql:
    image: mysql:8.0
    container_name: buncheoleasy-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: buncheoleasy_db
      TZ: Asia/Seoul
    volumes:
      - mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7-alpine
    container_name: buncheoleasy-redis
    ports:
      - "6379:6379"

volumes:
  mysql-data:
