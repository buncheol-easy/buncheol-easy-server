plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.epages.restdocs-api-spec' version '0.20.1'
}

group = 'buncheoleasy'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Spring MVC 의 @PathVariable / @RequestParam 파라미터 이름 자동 매핑이 가능하도록 컴파일 시 파라미터명을 클래스 파일에 포함.
tasks.withType(JavaCompile).configureEach {
    if (!options.compilerArgs.contains('-parameters')) {
        options.compilerArgs << '-parameters'
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    // application.yaml 을 직접 파싱하는 설정 인바리언트 테스트용. 버전은 Boot BOM 이 관리하고 좌표만 명시한다.
    testImplementation 'org.yaml:snakeyaml'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // JPA
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // MySQL
    runtimeOnly 'com.mysql:mysql-connector-j'

    // H2 Database for testing
    testRuntimeOnly 'com.h2database:h2'
    testImplementation 'org.testcontainers:junit-jupiter:1.20.4'
    testImplementation 'org.testcontainers:mysql:1.20.4'

    // Spring Security
    implementation "org.springframework.boot:spring-boot-starter-security"
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    testImplementation 'org.springframework.security:spring-security-test'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.7'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.7'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.7'

    // Redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // AWS S3
    implementation platform('software.amazon.awssdk:bom:2.27.21')
    implementation 'software.amazon.awssdk:s3'

    // Spring REST Docs + OpenAPI 생성
    testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
    testImplementation 'com.epages:restdocs-api-spec-mockmvc:0.20.1'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()

    // 테스트는 Gradle 과 별도 JVM 으로 포크된다. 이 상한은 원래 배포 박스(t3.small 2GB)에서 이미지를 빌드하던
    // 시절에 낮게 잡은 값이다(#84). 지금 이미지 빌드는 GitHub 호스팅 러너에서 돈다(#89) — Dockerfile 은 DocsTest 만
    // -PtestMaxHeap=384m 로, CI(test.yml)는 -PtestMaxHeap=1g 로 넘기고, 아무것도 안 넘기는 로컬 실행이 이 기본값을 쓴다.
    maxHeapSize = (findProperty('testMaxHeap') ?: '512m').toString()

    // 포크 수만큼 위 힙 상한이 곱해진다. 1 을 유지한다.
    maxParallelForks = 1

    // 힙만으로는 실사용량(RSS)이 잡히지 않는다. Spring 컨텍스트를 여러 개 띄우면 메타스페이스가 힙과
    // 별개로 수백 MB 까지 오르므로 함께 제한한다.
    jvmArgs "-XX:MaxMetaspaceSize=${findProperty('testMaxMetaspace') ?: '384m'}"

    // Spring TestContext 는 컨텍스트를 기본 32개까지 캐시에 쌓아 둔다. DocsTest 는 클래스마다 목 빈 조합이 달라
    // 거의 매번 새 컨텍스트를 만들므로, 캐시 상한이 없으면 테스트 클래스가 늘수록 힙 사용량이 계속 는다
    // (2026-10-22 실측: DocsTest 25개가 384m 에서 OOM, 로컬 전체가 512m 에서 OOM 으로 Gradle 이 멈춤).
    // 기본 8 로 묶어 테스트 수와 무관하게 상한을 고정한다. 밀려난 컨텍스트는 다시 필요하면 새로 만들지만,
    // 실측상 GC 가 헤매는 시간이 사라져 오히려 빨라졌다(384m DocsTest 4분35초 실패 → 28초 통과, 로컬 전체 512m 38초).
    // 다른 값이 필요하면 -PtestContextCacheSize=<n>.
    systemProperty 'spring.test.context.cache.maxSize', (findProperty('testContextCacheSize') ?: '8').toString()

    doFirst {
        def agent = configurations.testRuntimeClasspath.find {
            it.name.contains("byte-buddy-agent")
        }
        if (agent != null) {
            jvmArgs "-javaagent:${agent.absolutePath}"
        }
    }
}

openapi3 {
    server = '/'
    title = 'BuncheolEasy API'
    description = '분철이지 API 명세서'
    version = '0.0.1'
    format = 'yaml'
    outputDirectory = 'build/api-spec'
}

tasks.register('copyApiDocs', Copy) {
    dependsOn 'openapi3'
    from("${layout.buildDirectory.get()}/api-spec") {
        include 'openapi3.yaml'
    }
    into "${layout.buildDirectory.get()}/api-docs-static/static/v1/api-docs"
}

tasks.named('bootRun') {
    dependsOn 'copyApiDocs'
    classpath += files("${layout.buildDirectory.get()}/api-docs-static")
}

tasks.named('bootJar') {
    dependsOn 'copyApiDocs'
    from("${layout.buildDirectory.get()}/api-docs-static") {
        into 'BOOT-INF/classes'
    }
}
