# staging 전용 compose (독립 실행 — base docker-compose.yml 과 병합하지 않는다).
# production 박스도 같은 파일을 쓴다(환경 차이는 .env 가 흡수).
#
# 구성: MySQL 은 RDS(.env 의 DB_URL), Redis 는 컨테이너 유지. mysql 서비스 없음.
# backend 는 블루-그린 2색(호스트 8080=blue / 8081=green) — Nginx upstream 전환으로
# 무중단 배포한다(루트 docs/36 방안 1 · docs/39). 이미지는 GitHub 호스팅 러너가 빌드해
# ECR 에 올린다 — 박스에서 빌드하지 않는다(2026-07-29 사고 근본 조치, docs 35 §8-A · docs/38).
#
# 실행:  배포·전환·롤백은 scripts/blue-green.sh 로만 한다.
#        두 색 서비스는 profiles 뒤에 있어 맨손 `docker compose up -d` 는 redis 만 기동한다
#        (두 색 동시 기동·비활성 색 오기동 사고 방지 — 색 지정은 항상 서비스명 명시).
#        수동 단일 기동이 정말 필요할 때: docker compose -f docker-compose.staging.yml up -d backend-blue
# 상태:  scripts/blue-green.sh status   (활성 색·헬스·컨테이너 일괄 확인)
# 로그:  docker logs -f buncheoleasy-backend-blue   # 활성 색은 status 로 확인
# 헬스:  curl -fsS http://127.0.0.1:8080/actuator/health   # blue (green 은 8081)
#
# 주의:
# - DB_URL 은 여기서 설정하지 않는다 → .env 의 RDS endpoint 가 그대로 사용된다.
# - backend 는 외부에 직접 공개하지 않고 127.0.0.1 에만 바인딩한다(같은 EC2 의 Nginx 가 프록시).
# - 스키마 변경은 expand-contract 규칙을 따른다 — 전환 창에 구·신 버전이 같은 DB 를 본다
#   (src/main/resources/schema.sql 헤더 · docs/39).
# - ⚠️ redis 서비스 정의 변경은 블루-그린으로 무중단이 안 된다 — redis 는 두 색이 공유하는
#   단일 컨테이너라 재생성 순간 활성 색의 커넥션이 끊긴다(리프레시 토큰 등). 배포 스크립트는
#   redis 가 떠 있으면 건드리지 않으므로, 정의 변경은 별도 정비 창에서 수동 반영한다.

# 두 색의 공통 정의 — 차이는 컨테이너명·호스트 포트·profile 뿐이다.
x-backend-base: &backend-base
  # sha- 불변 태그는 워크플로가 셸 env 로 주입한다(셸 env 가 .env 보다 우선).
  # 수동 조작을 위해 박스 .env 에 환경 별칭 기본값 한 줄이 필요하다:
  #   staging: BACKEND_IMAGE=<ECR>/bce-backend:staging  /  prod: ...:prod   (docs/38)
  image: ${BACKEND_IMAGE:?BACKEND_IMAGE 미설정 — 박스 .env 에 기본값 추가 필요 (docs/38)}
  restart: unless-stopped
  depends_on:
    redis:
      condition: service_healthy
  env_file:
    - .env            # DB_URL(RDS), DB_USERNAME, DB_PASSWORD, OAuth, JWT 등 런타임 비밀값
  environment:
    TZ: UTC
    # REDIS_HOST 는 .env 값과 무관하게 컨테이너 서비스명 'redis' 로 강제한다(내부 네트워크 연결).
    REDIS_HOST: redis
    # REDIS_PORT 는 .env 값을 그대로 쓰되 미설정 시 6379 기본값(env_file 과 의도적 중복 — 기본값 보장용).
    REDIS_PORT: ${REDIS_PORT:-6379}
    # DB_URL 의도적으로 미설정 → .env 의 RDS endpoint 가 사용된다.
  # cgroup 상한이 없으면 UseContainerSupport 가 호스트 RAM(4GiB)으로 폴백해
  # MaxRAMPercentage 가 색당 최대 힙 수 GiB 로 계산된다 — 전환 창에 두 JVM 이 겹치는
  # 블루-그린에서는 박스 전체를 위협하는 값이다(7/29 스왑 스래싱과 같은 실패 모드).
  # 1500m + MaxRAMPercentage 60(Dockerfile) = 최대 힙 900m, 비힙(메타스페이스·코드캐시·
  # 스레드 등 ~300m+) 여유 600m — 힙이 상한까지 자라도 cgroup 을 넘지 않는 배분이다
  # (실측 평시 RSS 581MB). 겹침 최악 3GiB 는 t3.medium 에서 수용.
  # 한 색이 상한을 치면 그 컨테이너만 OOM-kill 되고(restart 가 복구) 박스는 산다.
  mem_limit: 1500m
  # memory-swap 미지정 시 docker 기본은 2×memory — 상한 초과가 OOM-kill 이 아니라
  # 스왑 내려쓰기(= 7/29 실패 모드)로 새 나간다. 동일값 지정 = 스왑 사용 금지.
  memswap_limit: 1500m
  # docker 기본 정지 유예 10초는 Spring graceful shutdown 기본 유예 30초를 SIGKILL 로 자른다
  # — 진행 중 요청 유실 방지의 전제 (docs/36 §5-1). 유예값 계약은 application.yaml 의
  # server.shutdown / spring.lifecycle.timeout-per-shutdown-phase(30s) 명시와 짝이다.
  stop_grace_period: 40s
  healthcheck:
    # "떴다"와 "서빙 가능하다"를 docker 가 구분하게 한다 (docs/36 §5-4). 진단·관측용 —
    # 배포 게이트는 스크립트의 "호스트" curl 이라 이 체크가 깨져도 배포는 막히지 않는다.
    # ⚠️ 컨테이너 안 curl 에 의존한다(eclipse-temurin:21-jre 는 ubuntu 베이스라 포함) —
    # 베이스를 alpine/distroless 로 바꾸면 영구 unhealthy 로 docker ps 만 조용히 거짓말한다.
    # 컨테이너 내부 포트는 두 색 모두 8080 — 호스트 바인딩만 다르다.
    test: ["CMD", "curl", "-fsS", "--max-time", "3", "http://127.0.0.1:8080/actuator/health"]
    interval: 10s
    timeout: 5s
    retries: 3
    # 실측 기동 ~28초(t3.medium, docs/36 P0-b) + JVM 여유. 이 동안의 실패는 카운트되지 않는다.
    start_period: 60s

services:
  redis:
    image: redis:7-alpine
    container_name: buncheoleasy-redis
    restart: unless-stopped
    # backend 와 같은 근거의 상한 — 2색 겹침 창의 박스 메모리 계산에서 redis 만 무상한
    # 변수로 남기지 않는다(실사용 수십 MB 수준, 토큰·레이트리밋 스토어뿐).
    mem_limit: 256m
    memswap_limit: 256m
    volumes:
      # 컨테이너 재생성/재배포 시 Redis 데이터(Refresh Token 등) 보존 — redis:7-alpine 기본 RDB 스냅샷이 /data 에 저장된다.
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend-blue:
    <<: *backend-base
    container_name: buncheoleasy-backend-blue
    profiles: ["blue"]
    ports:
      # 외부 직접 공개 금지 — localhost 바인딩(Nginx 가 upstream 전환으로 활성 색에 프록시).
      - "127.0.0.1:8080:8080"

  backend-green:
    <<: *backend-base
    container_name: buncheoleasy-backend-green
    profiles: ["green"]
    ports:
      - "127.0.0.1:8081:8080"

volumes:
  redis-data:
