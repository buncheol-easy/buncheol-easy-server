spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: buncheoleasy

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/buncheoleasy_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: root1234

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-name: Kakao
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_post
            scope:
              - account_email
              - openid

        provider:
          kakao:
            issuer-uri: https://kauth.kakao.com
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    buncheoleasy.buncheol: TRACE
    org.springframework.security: TRACE  # TRACE로 변경하면 더 자세함
    buncheoleasy.auth: TRACE
    org.springframework.jdbc: TRACE
    org.hibernate.SQL: DEBUG

jwt:
  secret:
    access-key: ${JWT_ACCESS_KEY}
    refresh-key: ${JWT_REFRESH_KEY}
  access-token-expiration-seconds: 7200   # 2시간
  refresh-token-expiration-seconds: 1209600 # 14일

cloud:
  aws:
    region:
      static: ap-northeast-2
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
    s3:
      bucket: buncheol-easy
      origin: https://buncheol-easy.s3.ap-northeast-2.amazonaws.com

app:
  base-url: http://localhost:8080

delivery:
  tracker:
    api-url: https://apis.tracker.delivery/graphql
    client-id: ${DELIVERY_TRACKER_CLIENT_ID}
    client-secret: ${DELIVERY_TRACKER_CLIENT_SECRET}
    callback-url: ${DELIVERY_TRACKER_CALLBACK_URL:http://localhost:8080/v1/deliveries/webhook/callback}
    connect-timeout: 3s
    read-timeout: 5s

toss:
  payments:
    client-key: ${TOSS_CLIENT_KEY}
    secret-key: ${TOSS_SECRET_KEY}
    confirm-url: "https://api.tosspayments.com/v1/payments/confirm"
    connect-timeout: 3s
    read-timeout: 5s
