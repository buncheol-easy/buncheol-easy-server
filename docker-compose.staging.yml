# staging 전용 compose (독립 실행 — base docker-compose.yml 과 병합하지 않는다).
# production 박스도 같은 파일을 쓴다(환경 차이는 .env 가 흡수).
#
# 구성: MySQL 은 RDS(.env 의 DB_URL), Redis 는 컨테이너 유지. mysql 서비스 없음.
# backend 이미지는 GitHub 호스팅 러너가 빌드해 ECR 에 올린다 — 박스에서 빌드하지 않는다
# (2026-07-29 스왑 스래싱 사고의 근본 조치, docs 35 §8-A · 루트 docs/38).
#
# 실행:  BACKEND_IMAGE=<ECR>/bce-backend:sha-... docker compose -f docker-compose.staging.yml up -d
#        (BACKEND_IMAGE 는 배포/롤백 워크플로가 주입. 수동 실행 시 박스 .env 의 기본값 사용)
# 상태:  docker compose -f docker-compose.staging.yml ps
# 로그:  docker compose -f docker-compose.staging.yml logs -f backend
# 헬스:  curl -fsS http://127.0.0.1:8080/actuator/health   # {"status":"UP"}
#
# 주의:
# - DB_URL 은 여기서 설정하지 않는다 → .env 의 RDS endpoint 가 그대로 사용된다.
# - backend 8080 은 외부에 직접 공개하지 않고 127.0.0.1 에만 바인딩한다(같은 EC2 의 Nginx 가 프록시).
services:
  redis:
    image: redis:7-alpine
    container_name: buncheoleasy-redis
    restart: unless-stopped
    volumes:
      # 컨테이너 재생성/재배포 시 Redis 데이터(Refresh Token 등) 보존 — redis:7-alpine 기본 RDB 스냅샷이 /data 에 저장된다.
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    # sha- 불변 태그는 워크플로가 셸 env 로 주입한다(셸 env 가 .env 보다 우선).
    # 수동 조작(up/restart 등)을 위해 박스 .env 에 환경 별칭 기본값 한 줄이 필요하다:
    #   staging: BACKEND_IMAGE=<ECR>/bce-backend:staging  /  prod: ...:prod   (docs/38)
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE 미설정 — 박스 .env 에 기본값 추가 필요 (docs/38)}
    container_name: buncheoleasy-backend
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      # 외부 직접 공개 금지 — localhost 바인딩(Nginx 가 127.0.0.1:8080 으로 프록시).
      - "127.0.0.1:8080:8080"
    env_file:
      - .env            # DB_URL(RDS), DB_USERNAME, DB_PASSWORD, OAuth, JWT 등 런타임 비밀값
    environment:
      TZ: UTC
      # REDIS_HOST 는 .env 값과 무관하게 컨테이너 서비스명 'redis' 로 강제한다(내부 네트워크 연결).
      REDIS_HOST: redis
      # REDIS_PORT 는 .env 값을 그대로 쓰되 미설정 시 6379 기본값(env_file 과 의도적 중복 — 기본값 보장용).
      REDIS_PORT: ${REDIS_PORT:-6379}
      # DB_URL 의도적으로 미설정 → .env 의 RDS endpoint 가 사용된다.

volumes:
  redis-data:
