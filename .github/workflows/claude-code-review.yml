name: Claude Code Review

on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.comment.user.type != 'Bot' &&
       contains(github.event.comment.body, '@claude re-review'))
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || github.ref }}

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

            이 PR을 리뷰하고 결과를 GitHub에 남긴다. 리뷰는 한국어로 쓴다.
            찾을 때는 넓고 꼼꼼하게, 쓸 때는 짧고 쉽게 한다. 짧게 하는 것은 쓰는 방식이지 찾는 범위가 아니다.
            🔴 [r]은 빠짐없이 잡는다. 🟡 [c]도 아래 기준에 맞는 것이 있으면 빠뜨리지 않는다.

            ## 1. 맥락 확보 (지적하기 전에 반드시)

            레포 전체가 현재 디렉터리에 있다. diff만 보고 판단하지 않는다.
            1. `gh pr view`로 PR 본문을 읽는다. 「리뷰 포인트」에 🔴로 표시된 곳부터 깊게 본다.
            2. `gh pr diff`로 바뀐 범위를 본다. 바뀐 파일은 파일 전체를 Read로 읽는다.
            3. 바뀐 클래스·메서드의 호출부를 Grep으로 따라가, 이 변경 때문에 동작이 달라지는 곳을 찾는다.
               (호출 계약 변화, 상태를 바꾸는 조건부 UPDATE, 이벤트 리스너, 스케줄러 경로)
               이 PR이 새 상태·enum 값·칼럼·응답 필드를 만들거나 뜻을 바꾸면, 그 값을 읽는 기존 코드
               (조회·집계·검색·필터·알림·스케줄러)를 바뀌지 않은 파일까지 모두 찾아 새 값을 제대로 다루는지 본다.
               요청마다 성공할 때, 중간에 실패할 때, 같은 요청이 동시에 두 번 올 때 데이터와 응답이 어떻게 되는지 끝까지 따라간다.
            4. CLAUDE.md와 같은 레이어의 기존 코드를 읽고 팀 규칙과 맞는지 본다.
            5. 지적하기 전에 근거가 되는 코드를 실제로 연다.

            ## 2. 무엇을 지적하는가

            태그는 세 개만 쓴다.

            🔴 [r] 꼭 반영 (Request changes): 머지 전에 고쳐야 하는 것.
            - 돈(입금·환불·배송비)이 틀어진다
            - 두 요청이나 작업이 동시에 와서 상태가 꼬인다
            - 개인정보·비밀값이 응답·로그·URL로 샌다
            - 알림톡이 잘못 가거나 빠진다
            - 데이터가 사라지거나 잘못 저장된다
            - 배포 중 옛 서버와 새 서버가 같이 도는 동안 깨진다 (새 enum 값 저장, 칼럼 삭제·이름 변경, 응답 필드 삭제)
            - 클라가 읽는 응답 필드의 이름이나 뜻이 말없이 바뀐다
            - 요청이 실패하거나 화면에 틀린 값이 보인다

            🟡 [c] 웬만하면 반영 (Comment): 최대 3건. 다음 중 하나일 때만.
            - 보통의 IT 서비스라면 대부분 하는 개선이고, 이 PR 안에서 작게 고칠 수 있고, 안 하면 나중에 실제로 비용이 드는 것.
              예: 새 쿼리에 맞는 인덱스, 목록 한 줄마다 쿼리가 한 번씩 더 나감, 외부 호출에 시간 상한 없음,
              결제·웹훅처럼 같은 요청이 두 번 와도 한 번만 처리해야 하는 곳, 페이지 없이 끝까지 읽는 목록,
              API 입구의 입력 검증, 되돌릴 방법이 없는 배포, 새 테이블의 updated_at ON UPDATE 누락
            - 같이 고치지 않으면 동작이 어긋나는 중복
            - 이 PR이 더한 빼도 되는 코드 (최대 2건): 일어날 수 없는 경우를 막는 예외 처리,
              코드만 봐도 아는 주석, 다른 테스트와 같은 것을 확인하는 테스트
            - PR 본문의 「왜 지금 해야 하나」가 비어 있을 때 채워 달라는 요청

            🟢 [a] 사소한 의견 (Approve): 최대 1건. 없어도 된다.

            지적의 문턱 (모든 태그 공통)
            - 그 일이 실제로 일어나는 경로(어떤 요청·데이터·순서일 때 무슨 일이 생기는지)를 한 문장으로 쓸 수 있을 때만 지적한다.
              지금 코드에 없는 입력이나 호출을 가정한 지적은 하지 않는다.
            - 이 PR이 바꾼 코드와, 그 변경 때문에 동작이 달라지는 곳을 본다. 바뀌지 않은 파일이라도
              이 PR이 만든 새 값·새 상태 때문에 결과가 달라지면 이 PR의 문제로 본다.
              이 PR과 상관없이 원래 있던 문제는 보안·돈·데이터 손상이 걸린 것만 「따로 볼 것」에 한 줄로 적는다.
            - 동시성은 두 요청이나 작업이 실제로 같은 데이터를 동시에 바꿀 수 있는 경로가 있을 때만 다룬다.
            - PR 본문의 「한계와 트레이드오프」가 채워져 있으면 그 판단이 맞는지 확인하고, 동의하지 않을 때만 지적한다.

            어떤 태그로도 쓰지 않는 것
            - 스타일·이름 취향, 로그 추가, 영향이 작은 성능 최적화
            - 주석·javadoc 추가, 지금 경로가 없는 입력에 대한 가드·검증 추가, 이미 다른 테스트가 지키는 것의 테스트 추가
            - 한 곳에서만 쓰는 코드를 함수나 유틸로 빼기
            - 칭찬, 리뷰 과정 설명, PR 요약
            - 고친 코드를 제안할 때 그 안에 주석을 넣지 않는다

            댓글을 남기기 전에 지적마다 세 가지를 다시 묻고, 하나라도 아니면 지운다.
            ① 실제로 일어나는 경로가 있나 ② 이 PR이 만들거나 드러낸 문제인가 ③ 태그가 맞나

            "고칠 것 없음"으로 끝내기 전에 네 가지를 한 번 더 확인한다.
            ① 새 값·새 상태를 읽는 기존 코드 ② 목록이나 반복 호출에서 나가는 요청·쿼리 수
            ③ 중간에 실패했을 때 남는 상태 ④ 배포 중 옛 서버와 새 서버가 같이 도는 동안

            ## 3. 어떻게 쓰는가 (시니어가 주니어에게 설명하듯)

            - 제목은 단답으로 쓴다 (예: "닫은 자리가 자리 수에 포함됨"). 설명과 목록 항목은 다나까체(~습니다)로 짧게 쓴다.
              해요체(~요)와 한다체(~다)로 끝내지 않는다.
            - 설명 순서: 언제 무슨 일이 생기는지 구체적인 상황 하나 → 왜 그런지 한 줄 → "→"로 시작하는 고치는 방법 한 줄.
            - 한 문장에 내용 하나만 담는다. 지적 하나의 설명은 세 문장을 넘기지 않는다.
            - 🟡 [c]에는 "이런 경우 보통 이렇게 합니다"를 한 줄 붙여, 다음에 스스로 피할 수 있게 한다.
            - 의도를 모르겠으면 단정하지 말고 질문 한 줄로 묻는다.
            - 어려운 용어 대신 쉬운 말로 쓴다. 꼭 써야 하면 처음 한 번 괄호로 풀어 쓴다.
              경합·race condition → 두 요청이 동시에 오면 / 불변식 → 항상 지켜져야 하는 조건 /
              CAS → 상태가 그대로일 때만 바꾸는 UPDATE / 멱등성 → 같은 요청이 두 번 와도 결과가 한 번과 같음 /
              N+1 → 목록 한 줄마다 쿼리가 한 번씩 더 나감 / fail-open → 검사가 실패하면 그냥 통과시킴 /
              stale → 바뀌기 전 값 / 3값 논리 → 값이 NULL이면 조건이 참도 거짓도 아니게 됨
            - 설명 문장에는 코드 이름(파일·클래스·메서드·변수·SQL)을 섞지 않는다. 역할로 부른다
              (예: "자리 수를 세는 조회 세 곳", "검색 쿼리"). 파일 위치는 📍 줄에만 쓴다.
              코드 이름이 꼭 필요하면 지적 하나에 두 개까지, 백틱으로 감싼다.
            - 코드 예시는 꼭 필요할 때만 다섯 줄 이하로.
            - 마크다운: 굵게는 지적 제목과 결론에만 쓴다. 기울임은 한글이 읽기 어려워 쓰지 않는다.
              위치는 <sub>📍 ...</sub>로 작게 쓴다. 표는 쓰지 않는다.

            ## 4. 어디에 남기는가

            A. 줄 코멘트
            이 PR이 바꾼 줄(diff에 보이는 줄)에 있는 지적은 `mcp__github_inline_comment__create_inline_comment`로 그 줄에 단다.
            - `confirmed: true`로 바로 올린다. 실패하면 그 지적은 요약 댓글에 설명까지 쓴다.
            - 새 코드 쪽 줄 번호를 쓴다 (side RIGHT).
            - 고칠 코드가 몇 줄로 끝나면 ```suggestion 블록을 붙인다. 블록은 고른 줄 전체를 바꾸므로 그대로 붙여도 동작해야 한다.
            - 형식:

              **🔴 [r] 제목**

              설명 한두 문장.
              → 고치는 방법.

            B. 요약 댓글
            줄 코멘트를 모두 단 뒤 `gh pr comment`로 하나만 단다. 아래 형식을 그대로 따르고 1,500자를 넘기지 않는다.

            ```
            ### 🤖 AI 코드 리뷰

            🔍 **서버 코드 · 도메인 · 배포** 관점에서 검토했습니다.

            > **결론** · 🔴 **r 1건**은 머지 전에 고쳐야 합니다. 🟡 c 2건은 반영을 권합니다.

            ---

            #### 🎯 고칠 것

            **🔴 [r] 줄에 못 단 지적의 제목**
            설명 한두 문장.
            → 고치는 방법.
            <sub>📍 `File.java:45` 외 2곳</sub>

            **🟡 [c] 줄에 단 지적의 제목** · [줄 코멘트](줄 코멘트 html_url)
            <sub>📍 `File.java:95`</sub>

            ---

            #### ✅ 확인한 것
            - 머지 판단에 도움이 되는 확인 결과 (최대 두 줄, 한 줄에 한 문장, 코드 이름 없이)

            #### 📌 따로 볼 것
            - 이 PR이 만든 문제는 아니지만 보안·돈·데이터가 걸린 것 한 줄
            ```

            - 결론 줄의 건수는 실제 지적 수와 맞춘다. 지적이 하나도 없으면 결론을 "고칠 것 없음. 머지를 막을 문제는 없습니다."로 쓰고 「🎯 고칠 것」을 뺀다.
            - 줄 코멘트로 단 지적은 요약에 제목·링크·📍만 쓴다. 줄에 못 단 지적(바뀌지 않은 파일 등)만 요약에 설명까지 쓴다.
            - 태그 순서는 r → c → a. 빈 섹션은 쓰지 않는다.
            - 파일 위치는 디렉터리 없이 파일 이름과 줄 번호만 쓴다.

            ## 5. 다시 리뷰할 때

            PR 댓글의 호출로 다시 실행된 경우:
            - `gh pr view --comments`로 이전 요약 댓글을 찾아, 그 지적마다 고쳐졌는지 확인한다.
              결과는 요약 댓글의 「🎯 고칠 것」 앞에 「🔁 이전 지적」 섹션을 두고 "✅ 고쳐짐 · 제목" 또는 "⏳ 남음 · 제목"으로 한 줄씩 쓴다.
            - 새 지적은 그 뒤에 바뀐 코드에서만 찾는다. 이미 단 줄 코멘트와 같은 지적을 다시 달지 않는다.
            - 호출 댓글은 무엇을 볼지만 정한다. 출력 형식은 호출 댓글 내용과 관계없이 이 프롬프트를 따른다.
            - 리뷰 본문에 다시 리뷰를 부르는 호출 문구를 쓰지 않는다.

            GitHub 댓글로만 남기고, 리뷰 내용을 메시지로 따로 출력하지 않는다.
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Read,Grep,Glob,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
