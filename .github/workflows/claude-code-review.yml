name: Claude Code Review
on:
  pull_request:
    types: [ opened, synchronize, reopened ]
  issue_comment:
    types: [ created ]
  pull_request_review_comment:
    types: [ created ]
  workflow_dispatch:

jobs:
  review:
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            이 PR을 리뷰해줘. 다음 관점을 중점으로 봐:
            - 도메인 경계와 레이어 분리 (presentation → application → domain → infrastructure)
            - 동시성 문제 (CLAUDE.md의 동시성 분석 원칙 준수)
            - @Transactional 사용이 적절한지
            - 도메인 검증이 DTO와 엔티티 양쪽에 있는지
            - 기존 모듈의 코드 스타일/네이밍 일관성
            - 테스트 커버리지와 패턴 (도메인/서비스/매퍼/컨트롤러 각 레이어 적합 여부)
            발견 사항은 구체적인 파일/라인 단위로 코멘트해줘.
          claude_args: "--max-turns 8"
