server:
  # nginx 등 reverse proxy 뒤에서 X-Forwarded-* 헤더로 원본 host/scheme/port 를 인식.
  # Spring Security OAuth2 의 {baseUrl} 자동치환, sendRedirect 등에 영향.
  forward-headers-strategy: framework
  # Boot 3.4+ 기본값이지만 명시로 고정한다 — compose 의 stop_grace_period: 45s 는
  # 이 graceful 유예(아래 30s) + @Async executor 대기(5s×2) + 여유라는 계약 위에 서 있다 (docs/39).
  shutdown: graceful

spring:
  lifecycle:
    # graceful shutdown 이 진행 중 요청을 기다려주는 상한 (기본값과 동일 — 계약 명시용).
    timeout-per-shutdown-phase: 30s

  config:
    import: optional:file:.env[.properties]

  application:
    name: buncheoleasy

  servlet:
    multipart:
      # 이미지 업로드(공지 본문·배너, 분철 최대 5장)용 상한. 기본값(1MB/파일)은 일반 사진에 너무 작다.
      # request 는 분철 5장(최대 5MB×5)까지 수용하도록 여유를 둔다.
      max-file-size: 5MB
      max-request-size: 30MB

  task:
    scheduling:
      pool:
        # 기본 1 이면 외부 HTTP 를 도는 스케줄러(추적 웹훅 갱신)가 지연될 때 입금만료·자동마감까지 같이 굶는다.
        size: 4
    execution:
      shutdown:
        # graceful shutdown(웹 요청 30s)은 @Async executor 를 기다려주지 않는다 — 기본값
        # (false)이면 드레인 막바지에 커밋된 알림톡·슬랙 이벤트가 shutdownNow 로 폐기된다.
        # 대기 5s 는 web 30s 와 "순차" 합산되므로 compose stop_grace_period(45s) 예산 안이어야
        # 한다 (docs/39, #92 6차 리뷰).
        await-termination: true
        await-termination-period: 5s

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/buncheoleasy_db?serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-name: Kakao
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_post
            # 쉼표 구분 목록. name·phone_number 는 카카오 검수 승인 후에만 추가할 것 —
            # 미승인 scope 를 요청하면 카카오 로그인 자체가 에러(KOE) 난다.
            # 검수 승인 후: KAKAO_SCOPES=account_email,openid,name,phone_number
            scope: ${KAKAO_SCOPES:account_email,openid}

        provider:
          kakao:
            issuer-uri: https://kauth.kakao.com
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

logging:
  level:
    buncheoleasy.buncheol: TRACE
    org.springframework.security: TRACE  # TRACE로 변경하면 더 자세함
    buncheoleasy.auth: TRACE
    org.springframework.jdbc: TRACE
    org.hibernate.SQL: DEBUG

jwt:
  secret:
    access-key: ${JWT_ACCESS_KEY}
    refresh-key: ${JWT_REFRESH_KEY}
  access-token-expiration-seconds: 7200   # 2시간
  refresh-token-expiration-seconds: 1209600 # 14일
  admin-token-expiration-seconds: 43200   # 12시간 (관리자 토큰은 refresh 없이 만료 시 재로그인)

# 관리자 계정 부트스트랩 (AdminAccountInitializer). 환경변수 미설정 시 건너뛴다.
admin:
  bootstrap:
    login-id: ${ADMIN_LOGIN_ID:}
    password: ${ADMIN_PASSWORD:}

cloud:
  aws:
    region:
      static: ap-northeast-2
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
    s3:
      bucket: ${S3_BUCKET:buncheol-easy-bucket}
      origin: https://${cloud.aws.s3.bucket}.s3.${cloud.aws.region.static}.amazonaws.com

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  kakao:
    # 카카오 REST API 호스트 (테스트에서 스텁 서버로 교체 가능).
    api-base-url: ${KAKAO_API_BASE_URL:https://kapi.kakao.com}
    # 로그인 요청 스레드에서 동기 호출되므로 타임아웃 필수 (Slack/Aligo 클라이언트와 동일 컨벤션).
    connect-timeout: 3s
    read-timeout: 5s
    # 간편가입 약관 목록에 등록한 '마케팅 수신 동의' 항목의 태그 — 콘솔 등록값과 반드시 일치시킬 것.
    # 기본값은 2026-07-24 디벨로퍼스 콘솔에 등록한 실제 태그(marketing-consent)와 맞춰둠.
    marketing-term-tag: ${KAKAO_MARKETING_TERM_TAG:marketing-consent}
  frontend:
    # 사용자 웹앱(프론트) origin. 알림톡 버튼·인앱 링크의 절대 URL base 로 사용한다(환경별로 다름).
    base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
    login-callback-url: ${FRONTEND_LOGIN_CALLBACK_URL:http://localhost:3000/login/callback}
  admin:
    # 운영자 어드민 웹 base URL. 슬랙 알림의 '어드민에서 처리' 링크로 사용한다.
    # local/staging 은 프론트 origin + /admin 경로, prod 는 별도 어드민 도메인을 env 로 주입한다.
    base-url: ${ADMIN_BASE_URL:http://localhost:3000/admin}
  cors:
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*}
  cookie:
    # 리프레시 토큰 쿠키의 Secure 속성 (HTTPS 전용). 로컬은 false, 운영은 true.
    secure: ${APP_COOKIE_SECURE:false}
  scheduler:
    # 블루-그린 기동 유예 게이트(SchedulerActivationGate) — 트래픽 전환 전(폐기될 수 있는)
    # 인스턴스의 스케줄러 부작용(DB 전이·알림 발송·외부 API 호출)을 차단한다. initial-delay
    # 로는 불충분하다: cron 트리거는 initial-delay 의 보호를 받지 않는다 (docs/39, #92 5차).
    # 값은 전환 스크립트 최악 경로(헬스 180s+웜업 15s+드레인 30s+생존 프로브 9s ≈ 234s)+여유
    # 에서 유도 — blue-green.sh 의 예산을 늘리면 같이 검토할 것.
    activation-grace: ${SCHEDULER_ACTIVATION_GRACE:300s}
  buncheol:
    auto-close: # 마감시간이 지난 분철의 마감을 판정(진행확정/취소)하는 스케줄러
      enabled: ${BUNCHEOL_AUTO_CLOSE_ENABLED:true}
      cron: ${BUNCHEOL_AUTO_CLOSE_CRON:0 0 * * * *} # 매 정각
      fallback-interval-ms: ${BUNCHEOL_AUTO_CLOSE_FALLBACK_INTERVAL_MS:600000} # 10분
      initial-delay-ms: ${BUNCHEOL_AUTO_CLOSE_INITIAL_DELAY_MS:10000} # 10초
  participation:
    payment-expiry: # 입금 기한 초과 입금확인중 참여를 자동 취소 및 알림하는 스케줄러
      enabled: ${PAYMENT_EXPIRY_ENABLED:true}
      interval-ms: ${PAYMENT_EXPIRY_INTERVAL_MS:60000} # 1분
      initial-delay-ms: ${PAYMENT_EXPIRY_INITIAL_DELAY_MS:10000} # 10초
  delivery:
    tracking-refresh: # 추적 웹훅 TTL 연장 + 상태 폴링(콜백 유실 안전망) 스케줄러
      enabled: ${TRACKING_REFRESH_ENABLED:true}
      # 웹훅 TTL(48h)의 절반 이하여야 만료 전 갱신 기회가 2회 이상 보장된다.
      interval-ms: ${TRACKING_REFRESH_INTERVAL_MS:43200000} # 12시간
      # ⚠️ 기동 유예 게이트(activation-grace 300s)보다 커야 한다 — 작으면 첫 발화가 skip 되고
      # fixedDelay 12h 라 다음 기회가 12시간 뒤로 밀려, 배포 주기가 그보다 짧으면 이 스케줄러는
      # 영구히 돌지 않는다(웹훅 TTL 갱신 중단 → 48h 후 추적 콜백 단절 — #92 6차 리뷰).
      initial-delay-ms: ${TRACKING_REFRESH_INITIAL_DELAY_MS:360000} # 6분 (> 유예 300s)
    pickup-reminder: # 지점 도착 후 미수령 독촉 알림 (매일 정오 일괄 발송)
      # ⚠️ 기본 꺼짐 — 발송 마킹(1회 dedup)이 발송 스킵과 무관하게 소진되므로 알리고
      # PICKUP_REMINDER_* 템플릿 승인·코드 설정 후에 켠다. 먼저 켜면 미수령 backlog 가 영영 독촉을 못 받는다.
      enabled: ${PICKUP_REMINDER_ENABLED:false}
      cron: ${PICKUP_REMINDER_CRON:0 0 12 * * *}
      # 12h 라야 낮에 도착한 택배가 반드시 "도착 다음 날 정오"에 걸린다 (24h 면 오후 도착 건이 하루 더 밀림).
      threshold: ${PICKUP_REMINDER_THRESHOLD:12h}
  feedback:
    rate-limit: # 의견 보내기 도배 방지 (비로그인 허용 엔드포인트라 필수)
      # 제출 주체(회원 ID 또는 IP) 1개당 한도.
      # ⚠️ 비로그인 제출은 프론트 프록시를 거쳐 오면 IP 가 프록시 하나로 수렴해 이 한도를 '공유'한다.
      # 개인당 한도가 아니라 '비로그인 전체 예산'으로 동작할 수 있어 여유 있게 잡는다.
      max-submissions: ${FEEDBACK_RATE_LIMIT_MAX:20}
      # 전체 합산 한도 — 헤더 조작으로 주체 키를 바꿔도 슬랙 도배량을 묶는 백스톱
      global-max-submissions: ${FEEDBACK_RATE_LIMIT_GLOBAL_MAX:60}
      # 단위를 붙이지 않으면 '분'으로 읽는다(@DurationUnit) — 10m 처럼 명시하는 것을 권장
      window: ${FEEDBACK_RATE_LIMIT_WINDOW:10m}

delivery:
  tracker:
    api-url: https://apis.tracker.delivery/graphql
    # 빈 기본값 필수 — env 에 키가 아예 없어도 "미설정 = 연동 꺼짐" 으로 동작해야 한다.
    client-id: ${DELIVERY_TRACKER_CLIENT_ID:}
    client-secret: ${DELIVERY_TRACKER_CLIENT_SECRET:}
    callback-url: ${DELIVERY_TRACKER_CALLBACK_URL:http://localhost:8080/v1/deliveries/webhook/callback}
    # 콜백 발신자 검증용 공유 비밀값 — 웹훅 등록 시 콜백 URL 쿼리에 심고 수신 시 비교한다. 비면 콜백 수신 거부.
    webhook-token: ${DELIVERY_TRACKER_WEBHOOK_TOKEN:}
    # 웹훅 유효기간 (Delivery Tracker 권장 최대 48h). 갱신 스케줄러가 만료 전 재등록으로 연장한다.
    webhook-ttl: ${DELIVERY_TRACKER_WEBHOOK_TTL:48h}
    connect-timeout: 3s
    # 추적 조회는 택배사 사이트 실시간 크롤링이라 수 초씩 걸릴 수 있다(5s 는 실측 타임아웃). 공식 권장 상한 15s.
    read-timeout: 15s

aligo:
  alimtalk:
    base-url: ${ALIGO_BASE_URL:https://kakaoapi.aligo.in}
    api-key: ${ALIGO_API_KEY}
    user-id: ${ALIGO_USER_ID}
    sender-key: ${ALIGO_SENDER_KEY}
    sender: ${ALIGO_SENDER}
    failover: ${ALIGO_FAILOVER:false}
    test-mode: ${ALIGO_TEST_MODE:true}
    connect-timeout: 3s
    read-timeout: 5s
    template-codes:
      PAYMENT_CONFIRMED: ${ALIGO_TPL_PAYMENT_CONFIRMED:}
      PAYMENT_EXPIRED: ${ALIGO_TPL_PAYMENT_EXPIRED:}
      BUNCHEOL_CONFIRMED: ${ALIGO_TPL_BUNCHEOL_CONFIRMED:}
      BUNCHEOL_CANCELLED: ${ALIGO_TPL_BUNCHEOL_CANCELLED:}
      TRACKING_CU: ${ALIGO_TPL_TRACKING_CU:}
      TRACKING_GS25: ${ALIGO_TPL_TRACKING_GS25:}
      PICKUP_REMINDER_CU: ${ALIGO_TPL_PICKUP_REMINDER_CU:}
      PICKUP_REMINDER_GS25: ${ALIGO_TPL_PICKUP_REMINDER_GS25:}
      PAYBACK_COMPLETED: ${ALIGO_TPL_PAYBACK_COMPLETED:}
      PAYBACK_REJECTED: ${ALIGO_TPL_PAYBACK_REJECTED:}

# 오픈 이벤트 배송비 환급(배송비 돌려받기). 이벤트 종료 시 enabled=false 로 내린다.
shipping-fee-payback:
  enabled: ${SHIPPING_FEE_PAYBACK_ENABLED:false}
  # 신청 마감 = 기준 시점(배송 완료) + N일. 분철·참여마다 기준 시점이 달라 상대 일수로 관리한다.
  submit-window-days: ${SHIPPING_FEE_PAYBACK_SUBMIT_WINDOW_DAYS:7}

payaction:
  # 입금 자동확인 SaaS. 키가 비어 있으면 주문 등록·웹훅 수신을 모두 꺼둔다(로컬·테스트 기본값).
  base-url: ${PAYACTION_BASE_URL:https://api.payaction.app}
  api-key: ${PAYACTION_API_KEY:}
  mall-id: ${PAYACTION_MALL_ID:}
  webhook-key: ${PAYACTION_WEBHOOK_KEY:}
  connect-timeout: 3s
  read-timeout: 5s

slack:
  webhook:
    connect-timeout: 3s
    read-timeout: 5s
    # 채널별 Incoming Webhook URL (SlackChannel enum 키). 시크릿이라 환경변수로만 주입하며, 빈 값이면 해당 채널 발송을 건너뛴다.
    urls:
      NEW_PARTICIPATION: ${SLACK_WEBHOOK_NEW_PARTICIPATION_URL:}
      SHIPPING_FEE_PAYBACK: ${SLACK_WEBHOOK_SHIPPING_FEE_PAYBACK_URL:}
      FEEDBACK: ${SLACK_WEBHOOK_FEEDBACK_URL:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
