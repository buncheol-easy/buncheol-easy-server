name: Test

# PR(base dev)에서 전체 테스트를 돌린다. 배포 빌드는 *DocsTest 19개만 돌리므로(Dockerfile)
# 나머지 테스트 클래스는 이 워크플로가 유일한 자동 실행 지점이다.
on:
  pull_request:
    branches:
      - dev
  workflow_dispatch:

# 같은 PR 에 새 푸시가 오면 이전 실행을 취소한다 (호스팅 러너 분수 절약)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # 반드시 GitHub 호스팅 러너 — self-hosted 는 운영 배포 박스라 빌드 부하가
    # 2026-07-29 스왑 스래싱 사고를 재현한다.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle (dependency/build cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Build and run full test suite
        # build = 전체 test + bootJar/OpenAPI 조립 검증.
        # 힙 1g: build.gradle 기본 512m 는 2GB 배포 박스 기준 — 호스팅 러너는 여유 있다.
        run: ./gradlew build -PtestMaxHeap=1g

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            build/test-results/test
          retention-days: 7
