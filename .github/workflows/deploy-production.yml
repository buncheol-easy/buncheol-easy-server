name: Deploy Backend Production

# main push -> GitHub 호스팅 러너가 이미지를 빌드해 ECR 에 push 하고,
# production EC2 의 self-hosted runner 는 pull + 컨테이너 교체만 한다.
# 구조·근거는 deploy-staging.yml 과 동일(빌드를 박스 밖으로 — docs 35 §8-A).
# 차이: 트리거 main, 러너 라벨 production, 별칭 태그 prod, 진행 중 배포는 끊지 않음.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: backend-production-deploy
  # production 은 진행 중 배포를 끊지 않는다(반쯤 배포된 상태 방지).
  cancel-in-progress: false

# 기본 최소권한 — build/promote 잡만 OIDC 용 id-token 을 자체 선언으로 추가한다
permissions:
  contents: read

env:
  ECR_REGISTRY: 823164610944.dkr.ecr.ap-northeast-2.amazonaws.com
  IMAGE_REPO: bce-backend

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      id-token: write   # OIDC 토큰 발급 (aws-actions/configure-aws-credentials)
      contents: read
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Resolve immutable image tag
        id: meta
        run: echo "tag=sha-$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::823164610944:role/bce-gha-ecr-push
          aws-region: ap-northeast-2

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # sha- 불변 태그만 push — prod 별칭은 헬스체크 통과 후 promote 잡이 옮긴다 (리뷰 #89).
          # ⚠️ main 머지 커밋은 dev 와 SHA 가 달라 prod 는 재빌드된다 — staging 에서 검증한
          # 이미지와 바이트 동일하지 않다(같은 소스의 재현 빌드). 승격 모델 전환은 후속 검토.
          tags: ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_REPO }}:${{ steps.meta.outputs.tag }}
          provenance: false
          # 기본 브랜치(dev)의 캐시는 모든 브랜치에서 읽힌다 — main 빌드도 dev 가 시딩한
          # 캐시를 재사용할 수 있다(리뷰 재검토에서 주석 정정).
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: [self-hosted, production]
    # 내부 최악 예산(pull 5m + up 3m + 헬스체크 3m = 11m)보다 커야
    # OS 레벨 timeout 이 잡 취소보다 먼저 발화한다 (리뷰 #89 반영)
    timeout-minutes: 15
    env:
      IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Sync source to deploy dir (preserve .env)
        run: |
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.gradle' \
            --exclude='build' \
            --exclude='.env*' \
            "${GITHUB_WORKSPACE}/" /home/ubuntu/buncheol-easy-server/

      - name: Pull image and swap container
        run: |
          set -e
          cd /home/ubuntu/buncheol-easy-server
          export BACKEND_IMAGE="${ECR_REGISTRY}/${IMAGE_REPO}:${IMAGE_TAG}"

          # 박스는 pull 만 한다 — 빌드 부하 0 이 이 구조의 존재 이유.
          # timeout 은 박스·네트워크 이상 시 잡이 매달리지 않게 하는 안전망(35 §11 교훈 유지).
          timeout -k 30s 5m docker compose -f docker-compose.staging.yml pull backend
          timeout -k 30s 3m docker compose -f docker-compose.staging.yml up -d

          echo "Waiting for backend health check..."
          # 벽시계 데드라인 — 재시도 횟수 × (curl 5s + sleep 5s) 곱셈 예산은 최악값이 주석과
          # 어긋나기 쉽다(리뷰 재검토에서 실제 최악 6.6m 지적). curl 호출당 상한은 여전히 필수.
          deadline=$((SECONDS + 180))
          until curl -fsS --connect-timeout 3 --max-time 5 http://127.0.0.1:8080/actuator/health > /dev/null; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Backend health check timed out after 180s"
              docker logs buncheoleasy-backend --tail=100
              exit 1
            fi
            echo "Backend is not ready yet..."
            sleep 5
          done
          echo "Backend health check passed"

          # 헬스체크는 "8080 이 살아있다"만 본다 — 떠 있는 게 방금 배포한 그 이미지인지 확인
          # (promote 의 "별칭 = 지금 떠 있는 것" 불변식의 전제 — 리뷰 반영)
          running=$(docker inspect -f '{{.Image}}' buncheoleasy-backend)
          expected=$(docker image inspect -f '{{.Id}}' "$BACKEND_IMAGE")
          if [ "$running" != "$expected" ]; then
            echo "::error::떠 있는 컨테이너가 배포 대상 이미지가 아니다: $running != $expected"
            exit 1
          fi

      - name: Post-mortem snapshot
        # cancelled() 포함 — 잡 타임아웃(=취소)이 가장 진단이 필요한 케이스다 (리뷰 #89 반영)
        if: failure() || cancelled()
        run: |
          cd /home/ubuntu/buncheol-easy-server
          export BACKEND_IMAGE="${ECR_REGISTRY}/${IMAGE_REPO}:${IMAGE_TAG}"
          free -h || true
          docker compose -f docker-compose.staging.yml ps || true
          docker logs buncheoleasy-backend --tail=100 || true

      - name: Retain last 3 images (rollback cache)
        # 박스 빌드가 없어져 builder prune 은 불필요해졌다. pull 된 sha- 이미지는 태그가 있어
        # image prune 으로 안 지워지므로 최근 3개만 남기고 정리한다(GitHub 불능 시 오프라인 롤백용).
        # 레지스트리 쪽 보존은 ECR lifecycle policy(sha- 최근 10개)가 담당한다.
        # ⚠️ 정렬은 이미지 Created(빌드 시각) 기준이지 pull 시각이 아니다 — 롤백으로 되돌린 옛
        # 이미지는 이후 배포 몇 번이면 밀려날 수 있다(실행 중 이미지는 rmi 실패로 살아남음).
        # 취소 시에는 돌지 않는다 — 롤백이 이 배포를 선점(취소)한 순간 오프라인 롤백 캐시를
        # 지우면 안 되기 때문 (리뷰 반영).
        if: success() || failure()
        run: |
          docker images --format '{{.Repository}}:{{.Tag}}' "${ECR_REGISTRY}/${IMAGE_REPO}" \
            | grep ':sha-' | tail -n +4 | xargs -r docker rmi || true
          docker image prune -f || true

  promote:
    # 별칭은 배포가 헬스체크까지 통과한 뒤에만 이동한다 — 실패한 배포의 이미지를 별칭이
    # 가리키면, 박스 .env 기본값(:prod)을 쓰는 수동 up/restart 가 롤백을 조용히 원복시킨다
    # (리뷰 #89 반영). 재빌드 없이 ECR 매니페스트 재태깅만 한다.
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    env:
      IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::823164610944:role/bce-gha-ecr-push
          aws-region: ap-northeast-2

      - name: Move 'prod' alias to deployed image
        run: |
          set -e
          resp=$(aws ecr batch-get-image --repository-name "$IMAGE_REPO" \
            --image-ids imageTag="$IMAGE_TAG" --output json)
          manifest=$(echo "$resp" | jq -r '.images[0].imageManifest // empty')
          mt=$(echo "$resp" | jq -r '.images[0].imageManifestMediaType // empty')
          # 태그 미존재 시 batch-get-image 는 exit 0 + failures 에만 담긴다 — 명시적 가드 (리뷰 반영)
          [ -n "$manifest" ] || { echo "::error::ECR 에 태그 없음: $IMAGE_TAG"; exit 1; }
          # mediaType 미전달 시 OCI 매니페스트에서 UnsupportedImageTypeException 가능 (리뷰 반영)
          args=(--repository-name "$IMAGE_REPO" --image-tag prod --image-manifest "$manifest")
          [ -n "$mt" ] && args+=(--image-manifest-media-type "$mt")
          out=$(aws ecr put-image "${args[@]}" 2>&1) \
            || { echo "$out" | grep -q ImageAlreadyExistsException || { echo "$out"; exit 1; }; }
          echo "alias 'prod' -> ${IMAGE_TAG}"
