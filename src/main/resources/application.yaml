server:
  # nginx 등 reverse proxy 뒤에서 X-Forwarded-* 헤더로 원본 host/scheme/port 를 인식.
  # Spring Security OAuth2 의 {baseUrl} 자동치환, sendRedirect 등에 영향.
  forward-headers-strategy: framework

spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: buncheoleasy

  servlet:
    multipart:
      # 이미지 업로드(공지 본문·배너, 분철 최대 5장)용 상한. 기본값(1MB/파일)은 일반 사진에 너무 작다.
      # request 는 분철 5장(최대 5MB×5)까지 수용하도록 여유를 둔다.
      max-file-size: 5MB
      max-request-size: 30MB

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/buncheoleasy_db?serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-name: Kakao
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_post
            # 쉼표 구분 목록. name·phone_number 는 카카오 검수 승인 후에만 추가할 것 —
            # 미승인 scope 를 요청하면 카카오 로그인 자체가 에러(KOE) 난다.
            # 검수 승인 후: KAKAO_SCOPES=account_email,openid,name,phone_number
            scope: ${KAKAO_SCOPES:account_email,openid}

        provider:
          kakao:
            issuer-uri: https://kauth.kakao.com
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

logging:
  level:
    buncheoleasy.buncheol: TRACE
    org.springframework.security: TRACE  # TRACE로 변경하면 더 자세함
    buncheoleasy.auth: TRACE
    org.springframework.jdbc: TRACE
    org.hibernate.SQL: DEBUG

jwt:
  secret:
    access-key: ${JWT_ACCESS_KEY}
    refresh-key: ${JWT_REFRESH_KEY}
  access-token-expiration-seconds: 7200   # 2시간
  refresh-token-expiration-seconds: 1209600 # 14일
  admin-token-expiration-seconds: 43200   # 12시간 (관리자 토큰은 refresh 없이 만료 시 재로그인)

# 관리자 계정 부트스트랩 (AdminAccountInitializer). 환경변수 미설정 시 건너뛴다.
admin:
  bootstrap:
    login-id: ${ADMIN_LOGIN_ID:}
    password: ${ADMIN_PASSWORD:}

cloud:
  aws:
    region:
      static: ap-northeast-2
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
    s3:
      bucket: ${S3_BUCKET:buncheol-easy-bucket}
      origin: https://${cloud.aws.s3.bucket}.s3.${cloud.aws.region.static}.amazonaws.com

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  kakao:
    # 카카오 REST API 호스트 (테스트에서 스텁 서버로 교체 가능).
    api-base-url: ${KAKAO_API_BASE_URL:https://kapi.kakao.com}
    # 로그인 요청 스레드에서 동기 호출되므로 타임아웃 필수 (Slack/Aligo 클라이언트와 동일 컨벤션).
    connect-timeout: 3s
    read-timeout: 5s
    # 간편가입 약관 목록에 등록한 '마케팅 수신 동의' 항목의 태그 — 콘솔 등록값과 반드시 일치시킬 것.
    # 기본값은 2026-07-24 디벨로퍼스 콘솔에 등록한 실제 태그(marketing-consent)와 맞춰둠.
    marketing-term-tag: ${KAKAO_MARKETING_TERM_TAG:marketing-consent}
  frontend:
    # 사용자 웹앱(프론트) origin. 알림톡 버튼·인앱 링크의 절대 URL base 로 사용한다(환경별로 다름).
    base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
    login-callback-url: ${FRONTEND_LOGIN_CALLBACK_URL:http://localhost:3000/login/callback}
  admin:
    # 운영자 어드민 웹 base URL. 슬랙 알림의 '어드민에서 처리' 링크로 사용한다.
    # local/staging 은 프론트 origin + /admin 경로, prod 는 별도 어드민 도메인을 env 로 주입한다.
    base-url: ${ADMIN_BASE_URL:http://localhost:3000/admin}
  cors:
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*}
  cookie:
    # 리프레시 토큰 쿠키의 Secure 속성 (HTTPS 전용). 로컬은 false, 운영은 true.
    secure: ${APP_COOKIE_SECURE:false}
  buncheol:
    auto-close: # 마감시간이 지난 분철의 마감을 판정(진행확정/취소)하는 스케줄러
      enabled: ${BUNCHEOL_AUTO_CLOSE_ENABLED:true}
      cron: ${BUNCHEOL_AUTO_CLOSE_CRON:0 0 * * * *} # 매 정각
      fallback-interval-ms: ${BUNCHEOL_AUTO_CLOSE_FALLBACK_INTERVAL_MS:600000} # 10분
      initial-delay-ms: ${BUNCHEOL_AUTO_CLOSE_INITIAL_DELAY_MS:10000} # 10초
  participation:
    payment-expiry: # 입금 기한 초과 입금확인중 참여를 자동 취소 및 알림하는 스케줄러
      enabled: ${PAYMENT_EXPIRY_ENABLED:true}
      interval-ms: ${PAYMENT_EXPIRY_INTERVAL_MS:60000} # 1분
      initial-delay-ms: ${PAYMENT_EXPIRY_INITIAL_DELAY_MS:10000} # 10초

delivery:
  tracker:
    api-url: https://apis.tracker.delivery/graphql
    client-id: ${DELIVERY_TRACKER_CLIENT_ID}
    client-secret: ${DELIVERY_TRACKER_CLIENT_SECRET}
    callback-url: ${DELIVERY_TRACKER_CALLBACK_URL:http://localhost:8080/v1/deliveries/webhook/callback}
    connect-timeout: 3s
    read-timeout: 5s

aligo:
  alimtalk:
    base-url: ${ALIGO_BASE_URL:https://kakaoapi.aligo.in}
    api-key: ${ALIGO_API_KEY}
    user-id: ${ALIGO_USER_ID}
    sender-key: ${ALIGO_SENDER_KEY}
    sender: ${ALIGO_SENDER}
    failover: ${ALIGO_FAILOVER:false}
    test-mode: ${ALIGO_TEST_MODE:true}
    connect-timeout: 3s
    read-timeout: 5s
    template-codes:
      PAYMENT_CONFIRMED: ${ALIGO_TPL_PAYMENT_CONFIRMED:}
      PAYMENT_EXPIRED: ${ALIGO_TPL_PAYMENT_EXPIRED:}
      BUNCHEOL_CONFIRMED: ${ALIGO_TPL_BUNCHEOL_CONFIRMED:}
      BUNCHEOL_CANCELLED: ${ALIGO_TPL_BUNCHEOL_CANCELLED:}
      TRACKING_CU: ${ALIGO_TPL_TRACKING_CU:}
      TRACKING_GS25: ${ALIGO_TPL_TRACKING_GS25:}
      PAYBACK_COMPLETED: ${ALIGO_TPL_PAYBACK_COMPLETED:}
      PAYBACK_REJECTED: ${ALIGO_TPL_PAYBACK_REJECTED:}

# 오픈 이벤트 배송비 환급(배송비 돌려받기). 이벤트 종료 시 enabled=false 로 내린다.
shipping-fee-payback:
  enabled: ${SHIPPING_FEE_PAYBACK_ENABLED:false}
  # 신청 마감 = 기준 시점(배송 완료) + N일. 분철·참여마다 기준 시점이 달라 상대 일수로 관리한다.
  submit-window-days: ${SHIPPING_FEE_PAYBACK_SUBMIT_WINDOW_DAYS:7}

slack:
  webhook:
    connect-timeout: 3s
    read-timeout: 5s
    # 채널별 Incoming Webhook URL (SlackChannel enum 키). 시크릿이라 환경변수로만 주입하며, 빈 값이면 해당 채널 발송을 건너뛴다.
    urls:
      NEW_PARTICIPATION: ${SLACK_WEBHOOK_NEW_PARTICIPATION_URL:}
      SHIPPING_FEE_PAYBACK: ${SLACK_WEBHOOK_SHIPPING_FEE_PAYBACK_URL:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
