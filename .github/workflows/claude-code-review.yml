name: Claude Code Review

on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude re-review'))
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || github.ref }}

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

            이 PR의 코드를 리뷰해주세요. 한국어로 답변해주세요.

            레포 전체가 현재 디렉터리에 체크아웃되어 있습니다. diff만 보고 판단하지 말고
            다음 순서로 코드베이스 컨텍스트를 확보한 뒤 리뷰하세요:
            1. `gh pr view`, `gh pr diff`로 PR 의도와 변경 범위를 파악한다.
            2. 변경된 파일은 diff 조각이 아니라 **파일 전체를 Read로 읽어** 변경이 놓인 맥락을 확인한다.
            3. 변경된 클래스·메서드의 호출부/사용처를 Grep으로 추적해 영향 범위를 검증한다
               (호출 계약 변화, 상태 전이 CAS, 이벤트 리스너, 스케줄러 경로 등).
            4. CLAUDE.md와 같은 레이어의 기존 코드를 읽고 컨벤션·패턴 일치 여부를 대조한다.
            5. 확신이 없는 지적은 관련 코드를 실제로 열어 확인한 뒤에만 코멘트한다.
               diff 밖 코드를 근거로 한 지적에는 해당 파일 경로를 근거로 명시한다.

            다음 항목들을 확인해주세요:
            - 코드 품질 및 가독성
            - 잠재적인 버그나 에러 (특히 diff 밖 호출부와의 계약 불일치)
            - 성능 이슈
            - 보안 취약점
            - 모범 사례 준수 여부 (특히 프로젝트 CLAUDE.md 컨벤션)
            - 동시성 이슈 (CLAUDE.md의 동시성 분석 원칙 참고)

            발견된 문제점과 개선 제안을 구체적으로 설명해주세요.

            Use `gh pr comment` for top-level feedback.
            Only post GitHub comments - don't submit review text as messages.
          claude_args: |
            --model opus
            --allowedTools "Read,Grep,Glob,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
