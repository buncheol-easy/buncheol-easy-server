spring:
  datasource:
    driver-class-name: org.h2.Driver
    # CASE_INSENSITIVE_IDENTIFIERS: H2 예약어(groups 등)를 Hibernate 가 "groups" 로 따옴표 조회할 때
    # H2 저장 식별자(GROUPS)와 대소문자 불일치가 나는 문제를 MySQL 동작에 맞춰 흡수한다.
    url: jdbc:h2:mem:testdb;MODE=MySQL;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql

# application.yaml 의 placeholder 중 아래에서 직접 override 하지 않는 것들만 테스트용 값으로 채움
# (운영 환경변수 없이도 컨텍스트가 뜰 수 있도록 — Docker 빌드, CI 등)
KAKAO_CLIENT_ID: test-kakao-client-id
KAKAO_CLIENT_SECRET: test-kakao-client-secret
AWS_ACCESS_KEY: test-aws-access-key
AWS_SECRET_KEY: test-aws-secret-key

logging:
  level:
    buncheoleasy: TRACE
    org.springframework.jdbc: DEBUG
    org.springframework.transaction: DEBUG
    org.hibernate.SQL: DEBUG
    org.h2: DEBUG

jwt:
  secret:
    access-key: test-jwt-access-secret-key-for-local-tests-only
    refresh-key: test-jwt-refresh-secret-key-for-local-tests-only
  access-token-expiration-seconds: 1800
  refresh-token-expiration-seconds: 1209600

admin:
  bootstrap:
    # 테스트에서는 관리자 계정 부트스트랩을 항상 비활성화한다. 개발자 셸에 ADMIN_LOGIN_ID/ADMIN_PASSWORD 가
    # 설정돼 있으면 ApplicationRunner 가 컨텍스트 기동 시 계정을 커밋해 테스트의 insertAdmin 과
    # 유니크 제약(uq_admins_login_id) 충돌이 났다 — 빈 값으로 고정해 셸 환경과 무관하게 만든다.
    login-id: ""
    password: ""

app:
  base-url: http://localhost:8080
  buncheol:
    # 테스트에서는 자동 마감 스케줄러를 비활성화 (의도치 않은 마감/낙찰 트리거 방지)
    auto-close:
      enabled: false
  participation:
    # 테스트에서는 입금 만료 자동취소 스케줄러를 비활성화
    payment-expiry:
      enabled: false
  delivery:
    # 테스트에서는 추적 웹훅 갱신·폴링, 미수령 독촉 스케줄러를 비활성화
    tracking-refresh:
      enabled: false
    pickup-reminder:
      enabled: false
      threshold: 12h

delivery:
  tracker:
    # api-url 은 비워 아웃바운드 호출(추적 조회·웹훅 등록)은 꺼둔 상태로 남기고,
    # 콜백 인증 경로를 테스트할 수 있게 더미 토큰만 채운다 (페이액션과 같은 방식).
    api-url: ""
    client-id: test-client-id
    client-secret: test-client-secret
    callback-url: http://localhost:8080/v1/deliveries/webhook/callback
    webhook-token: test-webhook-token
    webhook-ttl: 48h
    connect-timeout: 3s
    read-timeout: 5s

payaction:
  # 웹훅 인증 경로를 테스트할 수 있게 더미 키를 채운다. base-url 은 비워 아웃바운드 호출은 꺼둔 상태로 남긴다.
  base-url: ""
  api-key: ""
  mall-id: test-mall-id
  webhook-key: test-webhook-key

aligo:
  alimtalk:
    api-key: test-aligo-api-key
    user-id: test-aligo-user-id
    sender-key: test-aligo-sender-key
    sender: "01000000000"
